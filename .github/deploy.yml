name: Pipeline CI/CD - SIGR El Gourmet

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-lint:
    name: Etapa 1-2 - Build y Lint HTML/JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar estructura HTML5 y sintaxis JS
        run: |
          npx --yes htmlhint index.html
          node --check js/script.js

  docker-and-staging:
    name: Etapa 3-4 - Contenedor Nginx y Smoke Test Staging
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker con Nginx Alpine
        run: |
          printf "FROM nginx:alpine\nCOPY . /usr/share/nginx/html\nEXPOSE 80\n" > Dockerfile
          docker build -t sigr-el-gourmet:${{ github.sha }} .

      - name: Desplegar en Staging simulado y verificar HTTP 200
        run: |
          docker run -d --name sigr-staging -p 8080:80 sigr-el-gourmet:${{ github.sha }}
          sleep 2
          curl -f http://localhost:8080/index.html > /dev/null && echo "Despliegue Staging exitoso (HTTP 200)"
          docker rm -f sigr-staging